<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart — JingJang Store</title>
    <link rel="icon" type="image/png" href="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="header/header.css">
    <link rel="stylesheet" href="cart/cart.css">
    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .cart-page-content {
            flex: 1;
            max-width: 600px;
            width: 90%;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin-bottom: calc(75px + env(safe-area-inset-bottom, 0px));
        }

        :root {
            --bottom-nav-height: 58px;
            --sab: env(safe-area-inset-bottom, 0px);
            --sal: env(safe-area-inset-left, 0px);
            --sar: env(safe-area-inset-right, 0px);
        }

        .mobile-bottom-navbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(var(--bottom-nav-height) + var(--sab));
            padding-bottom: var(--sab);
            padding-left: var(--sal);
            padding-right: var(--sar);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid #f0f2f5;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 -4px 20px rgba(15, 23, 42, 0.05);
            box-sizing: border-box;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-decoration: none;
            color: #64748b;
            font-size: 10.5px;
            font-weight: 700;
            padding: 4px 0;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }

        .nav-tab .tab-icon {
            font-size: 19px;
            line-height: 1.2;
            margin-bottom: 2px;
            transition: transform 0.2s ease;
        }

        .nav-tab .tab-label {
            white-space: nowrap;
            letter-spacing: -0.2px;
        }

        .nav-tab.active {
            color: #3b665b;
        }

        .nav-tab.active .tab-icon {
            transform: scale(1.12);
        }

        .tab-icon-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tab-badge {
            position: absolute;
            top: -4px;
            right: -9px;
            background: #ff3b30;
            color: #ffffff;
            border-radius: 50%;
            min-width: 16px;
            height: 16px;
            font-size: 9.5px;
            font-weight: 800;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #ffffff;
            box-shadow: 0 2px 4px rgba(255, 59, 48, 0.35);
        }

        /* Override cart-sidebar styles so it works as a static element in the page flow */
        .cart-sidebar {
            position: static !important;
            width: 100% !important;
            height: auto !important;
            box-shadow: none !important;
            display: flex !important;
            flex-direction: column !important;
            background-color: transparent !important;
        }

        .close-cart {
            display: none !important;
            /* No close button since it's a page */
        }

        .back-to-shop {
            padding: 20px 25px 0 25px;
            background: #ffffff;
        }

        .back-to-shop a {
            color: #3b665b;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            transition: transform 0.2s ease;
        }

        .back-to-shop a:hover {
            transform: translateX(-4px);
        }

        /* Full screen on mobile */
        @media (max-width: 768px) {
            body {
                background-color: #ffffff;
            }

            .cart-page-content {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
                flex: 1;
            }

            .cart-sidebar {
                position: static !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                top: auto !important;
                right: auto !important;
                left: auto !important;
                transform: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                overflow: visible !important;
            }

            .back-to-shop {
                padding: 16px 20px;
                border-bottom: 1px solid #f1f2f6;
            }

            .cart-header {
                padding: 18px 20px;
                border-radius: 0;
            }

            .cart-items {
                padding: 16px 15px;
                flex: 1;
            }

            .cart-footer {
                padding: 20px 16px;
                border-radius: 0;
            }
        }

        @media (max-width: 480px) {
            .back-to-shop {
                padding: 12px 16px;
            }

            .cart-header {
                padding: 14px 16px;
            }

            .cart-items {
                padding: 12px 12px;
            }

            .cart-footer {
                padding: 14px 16px;
                padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
    <script src="config.js"></script>
</head>

<body>
    <div id="header-container"></div>

    <div class="cart-page-content">
        <div class="back-to-shop">
            <a href="index.html" onclick="goBack('index.html'); return false;">← Back to Shop</a>
        </div>
        <!-- Reuse the exact same HTML structure as cart.html partial -->
        <div id="cart-sidebar" class="cart-sidebar open">
            <div class="cart-header">
                <h2>Your Cart</h2>
            </div>

            <div id="cart-items" class="cart-items">
                <p style="text-align:center; color:#999;">Cart is empty</p>
            </div>

            <div class="cart-footer">
                <h3>Total: $<span id="cart-total">0.00</span></h3>
                <button class="cart-checkout-btn" onclick="openCheckout()">Checkout</button>
            </div>
        </div>
    </div>

    <!-- Fixed Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-navbar" id="mobile-bottom-navbar">
        <a href="index.html" class="nav-tab" id="tab-home" onclick="goBack('index.html'); return false;">
            <span class="tab-icon">🏠</span>
            <span class="tab-label">Home</span>
        </a>
        <a href="index.html" class="nav-tab" id="tab-shop" onclick="window.location.href='index.html'; return false;">
            <span class="tab-icon">📦</span>
            <span class="tab-label">Shop</span>
        </a>
        <a href="cart.html" class="nav-tab active" id="tab-cart" onclick="return false;">
            <span class="tab-icon-wrap">
                <span class="tab-icon">🛒</span>
                <span id="bottom-cart-count" class="tab-badge" style="display: none;">0</span>
            </span>
            <span class="tab-label">Cart</span>
        </a>
        <a href="index.html?openProfile=true" class="nav-tab" id="tab-profile" onclick="window.location.href='index.html?openProfile=true'; return false;">
            <span class="tab-icon-wrap" id="bottom-nav-avatar">
                <span class="tab-icon">👤</span>
            </span>
            <span class="tab-label">Profile</span>
        </a>
    </nav>

    <script src="cart/cart.js"></script>
    <script src="checkout/checkout.js"></script>
    <script src="profile/profile.js"></script>
    <script>
        // Go back using browser history to avoid reloading the page
        function goBack(fallbackUrl) {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                history.back();
            } else {
                window.location.href = fallbackUrl;
            }
        }

        // Inline routing helpers: on cart page (has back button), clicking Home also goes back
        function showPage(page) {
            if (page === 'home' || !page) {
                goBack('index.html');
            } else {
                window.location.href = `index.html?page=${page}`;
            }
        }
        function openProfile() {
            window.location.href = 'index.html?openProfile=true';
        }
        function logout() {
            window.location.href = 'index.html?logout=true';
        }
        function toggleMenu() {
            const menu = document.getElementById("nav-menu");
            if (menu) menu.classList.toggle("show");
        }

        function updateHeaderAuthUI() {
            var isLoggedIn = localStorage.getItem('jj_loggedIn') === 'true';
            var username = localStorage.getItem('jj_username');
            var userId = localStorage.getItem('jj_userId');
            var avatar = localStorage.getItem('jj_avatar');

            var loginBtn = document.getElementById('header-login-btn');
            var userInfo = document.getElementById('header-user-info');
            var profileBtn = document.getElementById('header-profile-btn');
            var logoutBtn = document.getElementById('header-logout-btn');
            var bottomAvatar = document.getElementById('bottom-nav-avatar');

            if (isLoggedIn && username && userId) {
                if (userInfo) userInfo.style.display = 'flex';
                if (profileBtn) profileBtn.style.display = 'flex';
                if (logoutBtn) logoutBtn.style.display = 'block';
                if (loginBtn) loginBtn.style.display = 'none';

                var nameEl = document.getElementById('header-username');
                var idEl = document.getElementById('header-user-id');
                if (nameEl) nameEl.textContent = username;
                if (idEl) idEl.textContent = userId;

                if (bottomAvatar) {
                    if (avatar) {
                        bottomAvatar.innerHTML = `<img src="${avatar}" alt="Avatar" style="width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1.5px solid #3b665b;">`;
                    } else {
                        bottomAvatar.innerHTML = `<span class="tab-icon">👤</span>`;
                    }
                }
            } else {
                if (loginBtn) loginBtn.style.display = 'block';
                if (userInfo) userInfo.style.display = 'none';
                if (profileBtn) profileBtn.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'none';
                if (bottomAvatar) {
                    bottomAvatar.innerHTML = `<span class="tab-icon">👤</span>`;
                }
            }
        }

        async function fetchAndCacheHtml(url, containerId, postProcessFn = null) {
            const cacheKey = 'jj_html_v4_' + url;
            const cachedHtml = localStorage.getItem(cacheKey);
            const container = document.getElementById(containerId);

            if (cachedHtml && container) {
                container.innerHTML = cachedHtml;
                if (postProcessFn) postProcessFn();
            }

            try {
                const fetchUrl = url.includes('?') ? url + '&_t=' + Date.now() : url + '?_t=' + Date.now();
                const response = await fetch(fetchUrl);
                const newHtml = await response.text();

                if (newHtml !== cachedHtml) {
                    localStorage.setItem(cacheKey, newHtml);
                    if (container) {
                        container.innerHTML = newHtml;
                        if (postProcessFn) postProcessFn();
                    }
                }
            } catch (err) {
                console.error("Error fetching " + url, err);
            }
        }

        async function loadComponents() {
            await fetchAndCacheHtml('header/header.html', 'header-container', () => {
                updateHeaderAuthUI();
                updateCartUI();
            });
            updateCartUI();
        }

        loadComponents();
    </script>
</body>

</html>
