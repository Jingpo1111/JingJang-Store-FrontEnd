<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resend + Domain OTP Tester</title>
    <script src="../config.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 350px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 500;
        }

        .success {
            color: #16a34a;
        }

        .error {
            color: #dc2626;
        }

        .loading {
            color: #4b5563;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Verify Email (EmailJS)</h2>

        <div id="step1">
            <input type="email" id="emailInput" placeholder="Enter your email" required>
            <button onclick="sendOTP()">Send OTP</button>
        </div>

        <div id="step2" style="display: none;">
            <p style="font-size: 14px; color: #666;">Check your inbox for the code.</p>
            <input type="text" id="otpInput" placeholder="6-digit code" maxlength="6" required>
            <button onclick="verifyOTP()">Verify Code</button>
        </div>

        <p id="status"></p>
    </div>

    <script>
        // ✅ NodeJS Backend OTP API (Powered by Resend)
        const OTP_URL = CONFIG.API_BASE + "/otp";

        const statusText = document.getElementById('status');

        async function sendOTP() {
            const email = document.getElementById('emailInput').value;
            if (!email) return alert("Enter email.");

            statusText.textContent = "Generating & sending OTP via Resend...";
            statusText.className = "loading";

            try {
                // Backend generates code, saves to MySQL, and sends directly via Resend from domain
                const response = await fetch(OTP_URL + '/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (data.status === "SUCCESS") {
                    statusText.textContent = "✅ OTP sent straight to your Inbox! (Expires in 5 minutes)";
                    statusText.className = "success";
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                } else if (data.status === "COOLDOWN") {
                    statusText.textContent = "⏳ " + data.message;
                    statusText.className = "error";
                } else {
                    statusText.textContent = data.message || "Failed to send OTP.";
                    statusText.className = "error";
                }
            } catch (error) {
                statusText.textContent = "Execution failed. Check backend connection.";
                statusText.className = "error";
            }
        }

        async function verifyOTP() {
            const email = document.getElementById('emailInput').value;
            const otp = document.getElementById('otpInput').value;

            statusText.textContent = "Verifying...";
            statusText.className = "loading";

            try {
                const response = await fetch(OTP_URL + '/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp: otp })
                });

                const data = await response.json();

                if (data.status === "SUCCESS") {
                    statusText.textContent = "🎉 Success! Email verified.";
                    statusText.className = "success";
                    document.getElementById('step2').style.display = 'none';
                } else {
                    statusText.textContent = data.message || "Invalid or expired OTP.";
                    statusText.className = "error";
                }
            } catch (error) {
                statusText.textContent = "Verification failed.";
                statusText.className = "error";
            }
        }
    </script>
</body>

</html>
