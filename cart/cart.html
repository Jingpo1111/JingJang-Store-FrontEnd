<!-- Cart Overlay & Slide-in / Bottom Sheet -->
<div id="cart-overlay" class="cart-overlay" onclick="toggleCart()"></div>

<div id="cart-sidebar" class="cart-sidebar">
    <div class="cart-header">
        <div class="cart-header-title">
            <span class="cart-header-icon">🛍️</span>
            <h2>Your Shopping Cart</h2>
        </div>
        <button type="button" class="close-cart-btn" onclick="toggleCart()" title="Close Cart">✕</button>
    </div>

    <div id="cart-items" class="cart-items">
        <p style="text-align:center; color:#94a3b8; padding: 40px 0; font-size: 15px; font-weight: 600;">Your cart is currently empty.</p>
    </div>

    <div class="cart-footer">
        <div class="cart-summary-row">
            <span class="cart-subtotal-label">Subtotal</span>
            <span class="cart-total-val">$<span id="cart-total">0.00</span></span>
        </div>
        <button type="button" class="cart-checkout-btn" onclick="openCheckout()">
            <span>Proceed to Checkout</span>
            <span class="checkout-arrow">→</span>
        </button>
    </div>
</div>
