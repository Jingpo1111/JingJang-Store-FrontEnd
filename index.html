<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JingJng-store</title>
    <link rel="icon" type="image/png" href="">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        html {
            scroll-behavior: smooth;
        }

        #main-container,
        #about-container,
        #contact-container {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            opacity: 0;
            transform: translateY(10px);
            will-change: opacity, transform;
        }

        .page-active {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
    <link rel="stylesheet" href="header/header.css">
    <link rel="stylesheet" href="footer/footer.css">
    <link rel="stylesheet" href="main/main.css">
    <link rel="stylesheet" href="cart/cart.css">
    <link rel="stylesheet" href="checkout/checkout.css">
    <link rel="stylesheet" href="about/about.css">
    <link rel="stylesheet" href="contact/contact.css">
    <link rel="stylesheet" href="profile/profile.css?v=2">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        emailjs.init({ publicKey: "NFPYtavChA35rx-xd" });
    </script>
    <script src="config.js"></script>
    <script src="main/main.js"></script>
</head>

<body>
    <div id="header-container"></div>
    <main id="main-container" class="page-active"></main>
    <div id="about-container" style="display: none;"></div>
    <div id="contact-container" style="display: none;"></div>
    <div id="footer-container"></div>
    <div id="cart-container"></div>
    <div id="checkout-container"></div>
    <div id="profile-container"></div>

    <script>
        // 🚀 Detect and handle Google OAuth callback parameters on page load
        (function handleGoogleAuthCallback() {
            var urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('auth') === 'google_success') {
                var userId = urlParams.get('userId') || ('CUST-' + urlParams.get('id'));
                var name = urlParams.get('name') || 'Google Customer';
                var email = urlParams.get('email') || '';
                var avatar = urlParams.get('avatar') || '';
                var role = urlParams.get('role') || 'customer';
                var regDate = urlParams.get('regDate') || '';

                // Save to localStorage for unified frontend session
                localStorage.setItem('jj_loggedIn', 'true');
                localStorage.setItem('jj_userId', userId);
                localStorage.setItem('jj_username', name);
                localStorage.setItem('jj_email', email);
                if (avatar) localStorage.setItem('jj_avatar', avatar);
                localStorage.setItem('jj_role', role);
                if (regDate) localStorage.setItem('jj_regDate', regDate);
                localStorage.setItem('jj_authType', 'google');

                // Remove auth query parameters from browser URL for clean display
                var cleanUrl = window.location.pathname;
                window.history.replaceState({}, document.title, cleanUrl);
            }
        })();

        function updateHeaderAuthUI() {
            var isLoggedIn = localStorage.getItem('jj_loggedIn') === 'true';
            var username = localStorage.getItem('jj_username');
            var userId = localStorage.getItem('jj_userId');
            var avatar = localStorage.getItem('jj_avatar');

            var loginBtn = document.getElementById('header-login-btn');
            var userInfo = document.getElementById('header-user-info');
            var profileBtn = document.getElementById('header-profile-btn');
            var logoutBtn = document.getElementById('header-logout-btn');

            if (isLoggedIn && username && userId) {
                // Show user info + profile + logout
                if (userInfo) userInfo.style.display = 'flex';
                if (profileBtn) {
                    profileBtn.style.display = 'flex';
                    if (avatar) {
                        profileBtn.innerHTML = `<img src="${avatar}" alt="Avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #2ecc71;">`;
                    } else {
                        profileBtn.innerHTML = '👤';
                    }
                }
                if (logoutBtn) logoutBtn.style.display = 'block';
                if (loginBtn) loginBtn.style.display = 'none';

                var nameEl = document.getElementById('header-username');
                var idEl = document.getElementById('header-user-id');
                if (nameEl) nameEl.textContent = username;
                if (idEl) idEl.textContent = userId;
            } else {
                // Show login button only
                if (loginBtn) loginBtn.style.display = 'block';
                if (userInfo) userInfo.style.display = 'none';
                if (profileBtn) profileBtn.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'none';
            }
        }

        async function fetchAndCacheHtml(url, containerId, postProcessFn = null) {
            const cacheKey = 'jj_html_' + url;
            const cachedHtml = localStorage.getItem(cacheKey);
            const container = document.getElementById(containerId);

            // 1. Show cached data instantly if available (don't reload UI if not changed)
            if (cachedHtml && container) {
                container.innerHTML = cachedHtml;
                if (postProcessFn) postProcessFn();
            }

            try {
                // 2. Fetch new data in the background (bypass browser cache)
                const fetchUrl = url.includes('?') ? url + '&_t=' + Date.now() : url + '?_t=' + Date.now();
                const response = await fetch(fetchUrl);
                const newHtml = await response.text();

                // 3. If data changed, update cache and reload the UI
                if (newHtml !== cachedHtml) {
                    localStorage.setItem(cacheKey, newHtml);
                    if (container) {
                        container.innerHTML = newHtml;
                        if (postProcessFn) postProcessFn();
                    }
                }
            } catch (err) {
                console.error("Error fetching " + url, err);
            }
        }

        async function loadComponents() {
            try {
                // Load critical components first (network priority)
                await Promise.all([
                    fetchAndCacheHtml('header/header.html', 'header-container', () => {
                        updateHeaderAuthUI();
                        if (typeof updateCartUI === 'function') updateCartUI();
                    }),
                    fetchAndCacheHtml('main/main.html', 'main-container', () => { if (typeof renderProducts === 'function') renderProducts(); }),
                    fetchAndCacheHtml('footer/footer.html', 'footer-container')
                ]);

                // Load non-critical components after critical ones finish fetching
                await Promise.all([
                    fetchAndCacheHtml('cart/cart.html', 'cart-container', () => { if (typeof updateCartUI === 'function') updateCartUI(); }),
                    fetchAndCacheHtml('checkout/checkout.html', 'checkout-container'),
                    fetchAndCacheHtml('profile/profile.html', 'profile-container', () => {
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('openProfile') === 'true') {
                            if (typeof openProfile === 'function') openProfile();
                        }
                    }),
                    fetchAndCacheHtml('about/about.html', 'about-container'),
                    fetchAndCacheHtml('contact/contact.html', 'contact-container')
                ]);

                // Query Parameter Routing on load
                const urlParams = new URLSearchParams(window.location.search);
                const pageParam = urlParams.get('page');
                if (pageParam && typeof showPage === 'function') {
                    showPage(pageParam);
                }
                if (urlParams.get('logout') === 'true') {
                    if (typeof logout === 'function') logout();
                }

            } catch (error) {
                console.error("Error in loadComponents:", error);
            }
        }

        // Start loading as soon as this script executes
        loadComponents();
    </script>
    <script>
        function toggleMenu() {
            document.getElementById("nav-menu").classList.toggle("show");
        }
    </script>
    <script>
        function showPage(page) {
            const main = document.getElementById('main-container');
            const about = document.getElementById('about-container');
            const contact = document.getElementById('contact-container');

            main.classList.remove('page-active');
            about.classList.remove('page-active');
            contact.classList.remove('page-active');

            window.scrollTo({ top: 0, behavior: 'smooth' });

            setTimeout(() => {
                if (page === 'home') {
                    main.style.display = 'block';
                    about.style.display = 'none';
                    contact.style.display = 'none';
                    setTimeout(() => main.classList.add('page-active'), 50);
                } else if (page === 'about') {
                    main.style.display = 'none';
                    about.style.display = 'block';
                    contact.style.display = 'none';
                    setTimeout(() => about.classList.add('page-active'), 50);
                } else if (page == 'contact') {
                    main.style.display = 'none';
                    about.style.display = 'none';
                    contact.style.display = 'block';
                    setTimeout(() => contact.classList.add('page-active'), 50);
                }
            }, 300);

            document.getElementById("nav-menu").classList.remove("show");
        }
    </script>

    <script src="cart/cart.js"></script>
    <script src="checkout/checkout.js"></script>
    <script src="profile/profile.js?v=6"></script>

    <script>
        // 🔐 Logout with "LOGOUT" confirmation
        function logout() {
            // Show the logout confirmation modal
            const modal = document.getElementById('logout-modal');
            if (modal) {
                modal.style.display = 'flex';
                setTimeout(() => { modal.style.opacity = '1'; }, 10);
                const inputEl = document.getElementById('logout-confirm-input');
                if (inputEl) {
                    inputEl.value = '';
                    inputEl.focus();
                }
                const errorEl = document.getElementById('logout-error');
                if (errorEl) errorEl.textContent = '';
            }
        }

        function cancelLogout() {
            const modal = document.getElementById('logout-modal');
            if (modal) {
                modal.style.opacity = '0';
                setTimeout(() => { modal.style.display = 'none'; }, 300);
            }
        }

        async function confirmLogout() {
            const inputEl = document.getElementById('logout-confirm-input');
            const inputVal = inputEl ? inputEl.value.trim() : '';
            const errorEl = document.getElementById('logout-error');
            const btn = document.getElementById('logout-confirm-btn');

            if (errorEl) errorEl.textContent = '';

            if (inputVal !== 'LOGOUT') {
                if (errorEl) {
                    errorEl.textContent = '❌ Please type "LOGOUT" to confirm.';
                    if (inputEl) {
                        inputEl.style.borderColor = '#e74c3c';
                        inputEl.focus();
                    }
                }
                return;
            }

            if (btn) {
                btn.textContent = '⏳ Logging out...';
                btn.disabled = true;
            }

            cancelLogout();
            await performLogout();
        }

        async function performLogout() {
            try {
                // Notify backend to clear express-session and cookie
                await fetch((CONFIG.API_BASE || '') + '/auth/logout', { credentials: 'include' });
            } catch (e) {
                console.warn('Backend logout error:', e);
            }

            localStorage.removeItem('jj_userId');
            localStorage.removeItem('jj_username');
            localStorage.removeItem('jj_loggedIn');
            localStorage.removeItem('jj_email');
            localStorage.removeItem('jj_regDate');
            localStorage.removeItem('jj_avatar');
            localStorage.removeItem('jj_role');
            localStorage.removeItem('jj_authType');
            window.location.href = 'login/login.html';
        }
    </script>

    <!-- Logout Confirmation Modal -->
    <div id="logout-modal" style="
        display: none;
        opacity: 0;
        transition: opacity 0.3s ease;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 99999;
        justify-content: center;
        align-items: center;
    ">
        <div style="
            background: #ffffff;
            border-radius: 20px;
            padding: 35px 30px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        ">
            <div style="font-size: 50px; margin-bottom: 10px;">🚪</div>
            <h2
                style="color: #2c3e50; font-size: 20px; font-weight: 700; margin-bottom: 8px; font-family: 'Inter', sans-serif;">
                Confirm Logout</h2>
            <p style="color: #7f8c8d; font-size: 13px; margin-bottom: 20px; font-family: 'Inter', sans-serif; line-height: 1.5;">
                Please type <b style="color: #e74c3c; font-weight: 800; letter-spacing: 1px;">LOGOUT</b> below to confirm signing out.
            </p>

            <input type="text" id="logout-confirm-input" placeholder='Type "LOGOUT"'
                autocomplete="off" spellcheck="false"
                onkeydown="if(event.key==='Enter') confirmLogout()" style="
                    width: 100%;
                    padding: 14px 16px;
                    border: 2px solid #e0e0e0;
                    border-radius: 12px;
                    font-size: 16px;
                    font-weight: 700;
                    letter-spacing: 2px;
                    text-align: center;
                    font-family: 'Inter', sans-serif;
                    outline: none;
                    transition: border-color 0.3s;
                    box-sizing: border-box;
                    margin-bottom: 10px;
                " onfocus="this.style.borderColor='#e74c3c'" onblur="this.style.borderColor='#e0e0e0'">

            <div id="logout-error"
                style="color: #e74c3c; font-size: 13px; font-weight: 500; min-height: 20px; margin-bottom: 10px; font-family: 'Inter', sans-serif;">
            </div>

            <div style="display: flex; gap: 10px;">
                <button onclick="cancelLogout()" style="
                    flex: 1;
                    padding: 13px;
                    border: 2px solid #e0e0e0;
                    border-radius: 12px;
                    background: #fff;
                    color: #555;
                    font-size: 14px;
                    font-weight: 600;
                    cursor: pointer;
                    font-family: 'Inter', sans-serif;
                    transition: all 0.3s;
                " onmouseover="this.style.background='#f5f5f5'" onmouseout="this.style.background='#fff'">
                    Cancel
                </button>
                <button id="logout-confirm-btn" onclick="confirmLogout()" style="
                    flex: 1;
                    padding: 13px;
                    border: none;
                    border-radius: 12px;
                    background: linear-gradient(135deg, #e74c3c, #c0392b);
                    color: #fff;
                    font-size: 14px;
                    font-weight: 700;
                    cursor: pointer;
                    font-family: 'Inter', sans-serif;
                    box-shadow: 0 4px 15px rgba(231, 76, 60, 0.35);
                    transition: all 0.3s;
                " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 8px 25px rgba(231,76,60,0.45)'"
                    onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 4px 15px rgba(231,76,60,0.35)'">
                    🔓 Confirm Logout
                </button>
            </div>
        </div>
    </div>

    <style>
        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</body>

</html>
